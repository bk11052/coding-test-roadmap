name: Link check

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check problems and links
        id: check
        run: |
          set +e
          python3 scripts/check_links.py > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open or update an issue when something is broken
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-link --color d73a4a --description "열리지 않는 링크" 2>/dev/null || true
          existing=$(gh issue list --label broken-link --state open --search "자동 링크 점검" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "자동 링크 점검: 깨진 링크가 있습니다" --label broken-link --body-file report.md
          fi
